<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4045" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#080405" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5a5f"/>
      <stop offset="100%" stop-color="#a83635"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161214"/>
      <stop offset="100%" stop-color="#080405"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#glow)"/>
  
  <!-- Pill Container -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#bg)" stroke="#ff4045" stroke-opacity="0.4" stroke-width="2"/>
  
  <!-- Typography / Monogram YW -->
  <text x="32" y="39" font-family="'Manrope', -apple-system, sans-serif" font-size="22" font-weight="800" fill="url(#grad)" text-anchor="middle" letter-spacing="-0.03em">YW</text>
</svg>

